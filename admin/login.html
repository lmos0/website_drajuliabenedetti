<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acesso Administrativo | Dra. Julia Benedetti</title>
    <meta
      name="description"
      content="Acesso restrito à área administrativa da Dra. Julia Benedetti."
    />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="../assets/images/branding/screen.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <script src="../assets/js/main.js" defer></script>
  </head>
  <body class="admin-body">
    <div class="admin-login">
      <div class="admin-login-image" aria-hidden="true">
        <img
          src="../assets/images/home/home-hero.jpeg"
          alt="Dra. Julia Benedetti em retrato editorial."
        />
        <div class="admin-login-overlay"></div>
      </div>

      <div class="admin-login-form">
        <div class="admin-login-card">
          <div class="admin-login-brand">
            <span class="admin-login-mark">JB</span>
            <h1>Acesso Restrito</h1>
            <p>Área Administrativa</p>
          </div>

          <form id="adminLoginForm" class="admin-login-fields" data-endpoint="http://localhost:8082/api/admin/auth/login" data-redirect="agenda.html" novalidate>
            <div class="field">
              <label for="admin-email">E-mail</label>
              <input
                type="email"
                id="admin-email"
                name="email"
                required
                autocomplete="email"
                placeholder="seu@email.com"
              />
            </div>

            <div class="field">
              <label for="admin-password">Senha</label>
              <input
                type="password"
                id="admin-password"
                name="password"
                required
                autocomplete="current-password"
                placeholder="••••••••"
              />
            </div>

            <div class="admin-login-actions">
              <a class="admin-login-forgot" href="#">
                Esqueci minha senha
              </a>
            </div>

            <button type="submit" class="button admin-login-submit">
              Acessar Painel
            </button>

            <div
              id="admin-login-status"
              class="form-status"
              role="status"
              aria-live="polite"
            ></div>
          </form>

          <div class="admin-login-footer">
            <p>Acesso exclusivo para administradores autorizados.</p>
            <a class="admin-login-back" href="../index.html">Voltar ao site</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
